    <script>
      // Ignore HMR / Vite client WebSocket connection errors in sandbox iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? String(event.message) : '';
        var filename = (event && event.filename) ? String(event.filename) : '';
        var errorStr = (event && event.error) ? String(event.error) : '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          filename.includes('@vite/client') ||
          errorStr.includes('WebSocket') ||
          errorStr.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reasonStr = (event && event.reason) ? String(event.reason) : '';
        if (
          reasonStr.includes('WebSocket') ||
          reasonStr.includes('createWebSocketModuleRunnerTransport') ||
          reasonStr.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>

    <script>
      (function() {
        try {
          var isReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var isAdmin = window.location.pathname.indexOf('/admin') === 0;
          var hasSeenSplash = false;
          try {
            hasSeenSplash = !!sessionStorage.getItem('ik_splash');
          } catch (e) {}

          if (hasSeenSplash || isAdmin || isReducedMotion) {
            document.documentElement.classList.add('no-splash');
          } else {
            try {
              sessionStorage.setItem('ik_splash', '1');
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>

      @keyframes logoScaleIn {
        from {
          opacity: 0;
          transform: scale(0.92);

        to {
          opacity: 1;
          transform: scale(1);

      }
      @keyframes splashFadeOut {
        0% {

        99% {
          opacity: 0;
          visibility: visible;
        }
        100% {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
